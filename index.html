<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAW Café — Menu</title>
<meta name="description" content="RAW Café menu — coffee, boba, matcha, milkshakes and smoothies.">
<meta name="theme-color" content="#4D3858">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#4D3858; --plum-2:#5E4769; --lilac:#C4A3DC; --lilac-2:#EFE8F3;
  --bg:#F7F2E8; --card:#FFFDF8; --ink:#2A2230; --mute:#7B6C86; --line:#E4D9CC;
  --chip:#EFE6D8; --hero-ink:#F7F2E8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121C; --card:#211A28; --ink:#F2ECF5; --mute:#A898B4; --line:#3A2F44; --chip:#2B2233; --lilac-2:#2E2438; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17121C; --card:#211A28; --ink:#F2ECF5; --mute:#A898B4; --line:#3A2F44; --chip:#2B2233; --lilac-2:#2E2438; color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;min-height:100vh}
img{display:block;max-width:100%}

/* ── hero ── */
.hero{background:var(--plum);color:var(--hero-ink);padding:calc(28px + env(safe-area-inset-top)) 20px 34px;text-align:center;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:var(--plum-2);opacity:.55}
.hero::before{width:260px;height:260px;left:-90px;top:-110px}
.hero::after{width:200px;height:200px;right:-70px;bottom:-120px}
.hero img{width:min(230px,62vw);margin:0 auto;position:relative;z-index:1}
.hero .tag{position:relative;z-index:1;margin-top:14px;font-size:12px;letter-spacing:.42em;text-transform:uppercase;font-weight:600;opacity:.9;padding-left:.42em}
.hero .sub{position:relative;z-index:1;margin-top:6px;font-size:14px;font-weight:300;opacity:.75}

/* ── sticky nav ── */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;margin:12px 16px 0;padding:0 14px;height:42px;border-radius:21px;background:var(--card);border:1px solid var(--line)}
.search svg{flex:none;opacity:.55}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--mute)}
.search button{border:0;background:none;color:var(--mute);font:inherit;font-size:20px;line-height:1;cursor:pointer;padding:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;scroll-snap-align:start;text-decoration:none;color:var(--ink);background:var(--chip);padding:8px 15px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.chips a.on{background:var(--plum);color:#F7F2E8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chips a.on{background:var(--lilac);color:#1C1522}}
:root[data-theme="dark"] .chips a.on{background:var(--lilac);color:#1C1522}

/* ── menu ── */
main{max-width:640px;margin:0 auto;padding:6px 16px 40px}
section{padding-top:26px;scroll-margin-top:118px}
.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sh h2{font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--plum)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sh h2{color:var(--lilac)}}
:root[data-theme="dark"] .sh h2{color:var(--lilac)}
.sh span{font-size:13px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:2px 0 8px}
.sz{display:flex;justify-content:flex-end;gap:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:6px 2px 0}
.sz b{width:56px;text-align:right;font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 16px;margin-top:8px}
.it{display:flex;align-items:baseline;gap:10px;padding:13px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .nm{flex:1;min-width:0}
.it .nm b{font-weight:600;font-size:16px}
.it .nm small{display:block;color:var(--mute);font-size:13px;margin-top:3px;line-height:1.35}
.it .pr{display:flex;gap:0;flex:none;font-variant-numeric:tabular-nums}
.it .pr span{width:56px;text-align:right;font-weight:700;font-size:16px}
.it .pr span.one{width:auto}
.flv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flv i{font-style:normal;font-size:12px;background:var(--lilac-2);color:var(--ink);padding:4px 10px;border-radius:999px}
.empty{text-align:center;color:var(--mute);padding:40px 0;display:none}
mark{background:var(--lilac);color:#1C1522;border-radius:3px;padding:0 1px}

footer{text-align:center;padding:10px 20px calc(36px + env(safe-area-inset-bottom));color:var(--mute);font-size:13px}
footer img{width:44px;margin:0 auto 10px;opacity:.85}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;margin-top:12px;cursor:pointer}
.k-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k-light{display:none}:root:not([data-theme="light"]) .k-dark{display:block}}
:root[data-theme="dark"] .k-light{display:none}:root[data-theme="dark"] .k-dark{display:block}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chips a{transition:none}}
</style>
</head>
<body>

<header class="hero">
  <img src="assets/logo-cream.png" alt="RAW">
  <div class="tag">Café · Menu</div>
  <div class="sub">Coffee · Boba · Matcha · Shakes</div>
</header>

<div class="bar">
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search the menu" autocomplete="off" aria-label="Search the menu">
    <button id="qx" type="button" aria-label="Clear search" hidden>×</button>
  </label>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div>

<main id="menu"></main>
<p class="empty" id="empty">Nothing matches your search.</p>

<footer>
  <img class="k-light" src="assets/koala-plum.png" alt="">
  <img class="k-dark" src="assets/koala-cream.png" alt="">
  All prices in EGP
  <br><button class="theme" id="theme" type="button">Light / Dark</button>
</footer>

<script>
// السعرين في الأصناف اللي ليها حجمين: [صغير، كبير]
var SIZES = ["Regular", "Large"];
var MENU = [
  { id: "hot", name: "Hot Coffee", sized: true, items: [
    ["Espresso", 75], ["Americano", [75, 95]], ["Macchiato", 80], ["Caramel Macchiato", [100, 115]],
    ["Cappuccino", [85, 100]], ["Latte", [85, 100]], ["Spanish Latte", [100, 115]], ["Pistachio Spanish Latte", [115, 130]],
    ["Salted Caramel Latte", [100, 115]], ["Toffee Nut Latte", [100, 115]], ["Popcorn Latte", [100, 115]], ["Cinnamon Latte", [100, 115]],
    ["Flat White", 100], ["Cortado", 95], ["Dark Chocolate Mocha", [100, 115]], ["White Chocolate Mocha", [100, 115]] ] },
  { id: "iced", name: "Iced Coffee", items: [
    ["Iced Latte", 100], ["Iced Spanish Latte", 115], ["Iced Pistachio Spanish Latte", 145], ["Iced Flat White", 115],
    ["Iced Americano", 105], ["Iced Salted Caramel Latte", 115], ["Iced Toffee Nut Latte", 115], ["Iced Cinnamon Latte", 115],
    ["Iced Popcorn Latte", 115], ["Iced Caramel Macchiato", 115], ["Iced Mocha", 115], ["Iced White Mocha", 115],
    ["Iced Tea", 105], ["Iced Hibiscus", 125], ["Red Bull", 115] ] },
  { id: "blended", name: "Blended Coffee", items: [
    ["Espresso", 100], ["Caramel", 115], ["Salted Caramel", 115], ["Toffee Nut", 125], ["Mocha", 115], ["White Mocha", 115] ] },
  { id: "blended-nc", name: "Blended Non-Coffee", items: [
    ["Salted Caramel", 105], ["Peanut Butter", 115], ["Cookies Nutella", 125], ["White Chocolate Strawberry", 115] ] },
  { id: "boba", name: "Boba", items: [
    ["Boba Milk Tea", 115], ["Boba Brown Sugar", 115], ["Boba Caramel", 115, "Original or salted"], ["Boba Coffee", 120],
    ["Boba Spanish Latte", 130], ["Boba Matcha", 130], ["Boba Taro", 150], ["Boba Salted Caramel Peanut Butter", 130],
    ["Boba White Chocolate", 125], ["Boba Cookies Nutella", 135], ["Boba Oreo", 115], ["Boba Lotus", 130],
    ["Boba Rose Litchi", 135], ["Boba Raspberry", 135], ["Boba Blueberry", 135], ["Boba Strawberry", 135],
    ["Boba Coconut", 135], ["Boba Colada", 135], ["Boba Mango Coconut", 130], ["Boba Mango Peach", 130],
    ["Boba Strawberry Coconut", 130], ["Boba Coconut Cacao", 130] ] },
  { id: "matcha", name: "Matcha", items: [
    ["Hot Matcha Latte", 115], ["Iced Matcha Classic", 115], ["Iced Matcha Vanilla", 130], ["Iced Matcha Salted Caramel", 130],
    ["Iced Matcha White Chocolate", 130], ["Iced Matcha Strawberry", 140], ["Iced Matcha Raspberry", 140], ["Iced Matcha Coconut", 140],
    ["Iced Matcha Mango", 140], ["Iced Matcha Lavender", 130], ["Blended Matcha", 125] ] },
  { id: "milkshake", name: "Milkshake", items: [
    ["Vanilla", 105], ["Chocolate", 105], ["Caramel", 105], ["Salted Caramel", 125], ["Taro", 135], ["Matcha", 135],
    ["Strawberry", 115], ["Blueberry", 115], ["Coconut", 115], ["Oreo", 115], ["Nutella", 125], ["Lotus", 125],
    ["Pistachio", 125], ["Kinder", 125] ] },
  { id: "smoothies", name: "Smoothies", items: [
    ["Blueberry", 95], ["Strawberry", 95], ["Mango Peach", 100], ["Mango Passion", 100], ["Orange Passion", 100],
    ["Coconut Strawberry", 100], ["Sour Kiwi", 100] ] },
  { id: "mojito", name: "Mojito", items: [
    ["Mojito", 90, null, ["Strawberry", "Blueberry", "Mixed Berry", "Raspberry", "Watermelon", "Peach", "Passion", "Sour Kiwi"]],
    ["Red Bull Mojito", 125] ] },
  { id: "extra", name: "Extras", items: [
    ["Espresso Shot", 35], ["Boba", 50], ["Flavor", 35, null, ["Vanilla", "Caramel", "Hazelnut", "Fruits"]], ["Water", 25] ] }
];

var $ = function (s) { return document.querySelector(s) };
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c] }) };
function hi(t, q) {
  if (!q) return esc(t);
  var i = t.toLowerCase().indexOf(q);
  return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
}
function price(p) {
  return Array.isArray(p) ? p.map(function (x) { return "<span>" + x + "</span>" }).join("") : '<span>' + p + '</span>';
}
function render(q) {
  q = (q || "").trim().toLowerCase();
  var shown = 0;
  $("#menu").innerHTML = MENU.map(function (c) {
    var items = c.items.filter(function (it) {
      return !q || it[0].toLowerCase().indexOf(q) >= 0 || c.name.toLowerCase().indexOf(q) >= 0 || (it[3] || []).join(" ").toLowerCase().indexOf(q) >= 0;
    });
    if (!items.length) return "";
    shown += items.length;
    return '<section id="' + c.id + '"><div class="sh"><h2>' + esc(c.name) + '</h2><span>' + items.length + ' items</span></div>'
      + (c.sized ? '<div class="sz"><b>' + SIZES[0] + '</b><b>' + SIZES[1] + '</b></div>' : '')
      + '<div class="list">' + items.map(function (it) {
        return '<div class="it"><div class="nm"><b>' + hi(it[0], q) + '</b>' + (it[2] ? '<small>' + esc(it[2]) + '</small>' : '')
          + (it[3] ? '<div class="flv">' + it[3].map(function (f) { return "<i>" + esc(f) + "</i>" }).join("") + '</div>' : '')
          + '</div><div class="pr">' + (c.sized && !Array.isArray(it[1]) ? '<span>&nbsp;</span>' : '') + price(it[1]) + '</div></div>';
      }).join("") + '</div></section>';
  }).join("");
  $("#empty").style.display = shown ? "none" : "block";
  watch();
}
$("#chips").innerHTML = MENU.map(function (c) { return '<a href="#' + c.id + '" data-id="' + c.id + '">' + esc(c.name) + '</a>' }).join("");

// القسم الظاهر على الشاشة بيتعلّم في الشريط
var obs;
function setOn(id) {
  document.querySelectorAll("#chips a").forEach(function (a) {
    var on = a.dataset.id === id; a.classList.toggle("on", on);
    if (on) a.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  });
}
function watch() {
  if (obs) obs.disconnect();
  if (!("IntersectionObserver" in window)) return;
  obs = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) setOn(e.target.id) });
  }, { rootMargin: "-130px 0px -65% 0px" });
  document.querySelectorAll("main section").forEach(function (s) { obs.observe(s) });
}
$("#chips").addEventListener("click", function (e) { var a = e.target.closest("a"); if (a) setOn(a.dataset.id) });

var q = $("#q"), qx = $("#qx");
q.addEventListener("input", function () { qx.hidden = !q.value; render(q.value); if (q.value) window.scrollTo({ top: $(".bar").offsetTop, behavior: "smooth" }) });
qx.addEventListener("click", function () { q.value = ""; qx.hidden = true; render(""); q.focus() });

$("#theme").addEventListener("click", function () {
  var r = document.documentElement, cur = r.getAttribute("data-theme");
  var dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("raw-menu-theme", dark ? "light" : "dark") } catch (e) {}
});
try { var t = localStorage.getItem("raw-menu-theme"); if (t) document.documentElement.setAttribute("data-theme", t) } catch (e) {}

render("");
setOn(MENU[0].id);
</script>
</body>
</html>
